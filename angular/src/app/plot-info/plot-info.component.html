<abp-page [title]="'::Menu:PlotInfo' | abpLocalization">
  <abp-page-toolbar-container class="col">
    <div class="text-end">
      <button
        *abpPermission="'Billing.PlotInfos.Create'"
        id="create"
        class="btn btn-outline-primary btn-sm"
        type="button"
        (click)="navigateToCreate()">
        <i class="fa fa-plus me-1"></i> {{ '::NewPlotInfo' | abpLocalization }}
      </button>
    </div>
  </abp-page-toolbar-container>

  <!-- Search + Filters -->
  <div class="card">
    <div class="card-body">
      <div class="row align-items-center">
        <div class="col-10">
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              [placeholder]="'::SearchHere' | abpLocalization"
              [(ngModel)]="filters.filter" />
            <button type="button" class="btn btn-primary" (click)="list.get()">
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>
        <div class="col-2 text-end">
          <button class="btn btn-outline-primary w-100" (click)="showFilter = !showFilter">
            {{ '::Filters' | abpLocalization }}
            <i class="fas" [ngClass]="showFilter ? 'fa-angle-up' : 'fa-angle-down'"></i>
          </button>
        </div>
      </div>

      <!-- Filter Panel -->
      <div *ngIf="showFilter" class="mt-2">
        <div class="row g-2">
          <div class="col-sm-3">
            <label>{{ '::PlotNo' | abpLocalization }}</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.plotNo" />
          </div>
          <div class="col-sm-3">
            <label>{{ '::StreetNo' | abpLocalization }}</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.streetNo" />
          </div>
          <div class="col-sm-3">
            <label>{{ '::Status' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.status" class="w-100" nzAllowClear nzShowSearch>
              <nz-option *ngFor="let status of plotStatus" [nzValue]="status.value" [nzLabel]="'::Enum:PlotStatus:' + status.value | abpLocalization"></nz-option>
            </nz-select>
          </div>
           <div class="col-sm-3">
            <label>{{ '::Phases' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.phaseId" class="w-100" nzAllowClear nzShowSearch>
              <nz-option *ngFor="let phase of phases" [nzValue]="phase.id" [nzLabel]="phase.phaseName"></nz-option>
            </nz-select>
          </div>
           <div class="col-sm-3">
            <label>{{ '::Blocks' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.blockId" class="w-100" nzAllowClear nzShowSearch>
              <nz-option *ngFor="let block of blocks" [nzValue]="block.id" [nzLabel]="block.blockName"></nz-option>
            </nz-select>
          </div>
           <div class="col-sm-3">
            <label>{{ '::Consumers' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.consumerId" class="w-100" nzAllowClear nzShowSearch>
              <nz-option *ngFor="let consumer of consumers" [nzValue]="consumer.id" [nzLabel]="consumer.firstName + ' ' + consumer.lastName"></nz-option>
            </nz-select>
          </div>

          <div class="col-sm-auto d-flex align-items-end gap-1">
            <button type="button" class="btn btn-sm btn-outline-primary" (click)="clearFilters()">
              <i class="fas fa-undo"></i> {{ '::Reset' | abpLocalization }}
            </button>
            <button type="button" class="btn btn-primary btn-sm" (click)="list.get()">
              <i class="fa fa-filter"></i> {{ '::Apply' | abpLocalization }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="card mt-2">
    <div class="card-body">
      <ngx-datatable [rows]="plots.items" [count]="plots.totalCount" [list]="list" default>
        <!-- Actions -->
        <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body" class="d-inline-block">
              <button class="btn btn-primary btn-sm dropdown-toggle" ngbDropdownToggle>
                <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
              </button>
              <div ngbDropdownMenu>
                <button *abpPermission="'Billing.PlotInfos.Edit'" ngbDropdownItem (click)="editPlot(row.id)">
                  {{ '::Edit' | abpLocalization }}
                </button>
                <button *abpPermission="'Billing.PlotInfos.Delete'" ngbDropdownItem (click)="delete(row.id)">
                  {{ '::Delete' | abpLocalization }}
                </button>
                <button *abpPermission="'Billing.PlotInfos.View'" ngbDropdownItem (click)="viewPlot(row.id)">
                  {{ '::View' | abpLocalization }}
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <!-- Columns -->
        <ngx-datatable-column [name]="'::PlotNo' | abpLocalization" prop="plotNo"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::StreetNo' | abpLocalization" prop="streetNo"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::Block' | abpLocalization" prop="phaseName"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::Phase' | abpLocalization" prop="phaseName"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::Status' | abpLocalization" prop="status">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ ('::Enum:PlotStatus:' + row.status) | abpLocalization }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column [name]="'::Remarks' | abpLocalization" prop="remarks"></ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>
</abp-page>
