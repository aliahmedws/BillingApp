 <!--Tarrif Slabs-->
 <abp-page [title]="'::Menu:TarrifSlab' | abpLocalization">
  <abp-page-toolbar-container class="col">
    <div class="text-end">
      <button *abpPermission="'Billing.TarrifSlabs.Create'" id="create" class="btn btn-outline-primary btn-sm" type="button" (click)="createTarrifSlab()">
        <i class="fa fa-plus me-1"></i> {{ '::NewTarrifSlab' | abpLocalization }}
      </button>
    </div>
  </abp-page-toolbar-container> 
  
   <!-- Search + Filters -->
  <div class="card">
    <div class="card-body">
      <div class="row align-items-center">
        <div class="col-10">
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              [placeholder]="'::SearchHere' | abpLocalization"
              [(ngModel)]="filters.filter"/>
            <button type="button" class="btn btn-primary" (click)="list.get()">
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>
        <div class="col-2 text-end">
          <button class="btn btn-outline-primary w-100" (click)="showFilter = !showFilter">
            {{ '::Filters' | abpLocalization }}
            <i class="fas" [ngClass]="showFilter ? 'fa-angle-up' : 'fa-angle-down'"></i>
          </button>
        </div>
      </div>

   <!-- Filter Panel -->
      <div *ngIf="showFilter" class="mt-2">
        <div class="row g-2">
          <div class="col-sm-3">
            <label>{{ '::LowerSlab' | abpLocalization }}</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.lowerSlab" />
          </div>
          <div class="col-sm-3">
            <label>{{ '::UpperSlab' | abpLocalization }}</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.upperSlab" />
          </div>
            <div class="col-sm-3">
            <label>{{ '::UnitPrice' | abpLocalization }}</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.unitPrice" />
          </div>
           <div class="col-sm-auto d-flex align-items-end gap-1">
            <button type="button" class="btn btn-sm btn-outline-primary" (click)="clearFilters()">
              <i class="fas fa-undo"></i> {{ '::Reset' | abpLocalization }}
            </button>
            <button type="button" class="btn btn-primary btn-sm" (click)="list.get()">
              <i class="fa fa-filter"></i> {{ '::Apply' | abpLocalization }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

    <!-- Table -->
  <div class="card mt-2">
    <div class="card-body">
      <ngx-datatable [rows]="tarrifSlab.items" [count]="tarrifSlab.totalCount" [list]="list" default>
        <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body" class="d-inline-block">

              <button class="btn btn-primary btn-sm dropdown-toggle" ngbDropdownToggle>
                <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
              </button>             
              <div ngbDropdownMenu>

                <button *abpPermission="'Billing.TarrifSlabs.Edit'" ngbDropdownItem (click)="editTarrifSlab(row.id)">
                  {{ '::Edit' | abpLocalization }}
                </button>

                <button *abpPermission="'Billing.TarrifSlabs.Delete'" ngbDropdownItem (click)="delete(row.id)">
                  {{ '::Delete' | abpLocalization }}
                </button>
              </div>
            </div>
          </ng-template>
         </ngx-datatable-column>
         <ngx-datatable-column [name]="'::LowerSlab' | abpLocalization" prop="lowerSlab"></ngx-datatable-column>
         <ngx-datatable-column [name]="'::UpperSlab' | abpLocalization" prop="upperSlab"></ngx-datatable-column>
         <ngx-datatable-column [name]="'::UnitPrice' | abpLocalization" prop="unitPrice"></ngx-datatable-column>
       
     </ngx-datatable>
    </div>
  </div>
</abp-page>

<!-- Create/Edit Modal -->
<abp-modal [(visible)]="isModalOpen" size="lg">
  <ng-template #abpHeader>
    <h3 class="text-danger fs-2">{{ (selectedTarrifSlab.id ? '::Edit' : '::NewTarrifSlab') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()">

      <!-- <div class="col-md-12 mb-2"> -->
        <div class="mt-2">
         <label for="lowerSlab" class="form-label">{{ '::LowerSlab' | abpLocalization }} <span class="text-danger">*</span></label>
        <input type="number" id="lowerSlab" class="form-control" formControlName="lowerSlab" />
        <small class="form-text text-muted">{{ '::Help:LowerSlab' | abpLocalization }}</small>
      </div>

       <div class="mt-2">
         <label for="upperSlab" class="form-label">{{ '::UpperSlab' | abpLocalization }}</label>
        <input id="upperSlab" type="number" class="form-control" formControlName="upperSlab" />
        <small class="form-text text-muted">{{ '::Help:UpperSlab' | abpLocalization }}</small>
      </div>

       <div class="mt-2">
         <label for="unitPrice" class="form-label">{{ '::UnitPrice' | abpLocalization }} <span class="text-danger">*</span></label>
        <input id="unitPrice" type="number" class="form-control" formControlName="unitPrice" />
        <small class="form-text text-muted">{{ '::Help:UnitPrice' | abpLocalization }}</small>
      </div>

    </form>
  </ng-template>

 <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" (click)="isModalOpen = false">
      {{ '::Cancel' | abpLocalization }}
    </button>
    <button type="submit" class="btn btn-primary" (click)="save()" [disabled]="form?.invalid">
      <i class="fas fa-check mr-1"></i> {{ '::Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
