<abp-page [title]="'::Menu:MeterInfo' | abpLocalization">
  <abp-page-toolbar-container class="col">
    <div class="text-end">
      <button
        *abpPermission="'Billing.MeterInfos.Create'"
        id="create"
        class="btn btn-outline-primary btn-sm"
        type="button"
        (click)="navigateToCreate()">
        <i class="fa fa-plus me-1"></i> {{ '::NewMeterInfo' | abpLocalization }}
      </button>
    </div>
  </abp-page-toolbar-container>

  <!-- Search + Filters -->
  <div class="card">
    <div class="card-body">
      <div class="row align-items-center">
        <div class="col-10">
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              [placeholder]="'::SearchHere' | abpLocalization"
              [(ngModel)]="filters.filter" />
            <button type="button" class="btn btn-primary" (click)="list.get()">
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>
        <div class="col-2 text-end">
          <button class="btn btn-outline-primary w-100" (click)="showFilter = !showFilter">
            {{ '::Filters' | abpLocalization }}
            <i class="fas" [ngClass]="showFilter ? 'fa-angle-up' : 'fa-angle-down'"></i>
          </button>
        </div>
      </div>

      <div *ngIf="showFilter" class="mt-2">
        <div class="row g-2">
          <div class="col-sm-3">
            <label>{{ '::MeterNo' | abpLocalization }}</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.meterNo" />
          </div>
          <div class="col-sm-3">
            <label>{{ '::MeterType' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.meterType" class="w-100" nzAllowClear nzShowSearch>
              <nz-option *ngFor="let type of meterTypes" [nzValue]="type.value" [nzLabel]="'::Enum:MeterType:' + type.value | abpLocalization"></nz-option>
            </nz-select>
          </div>
          <div class="col-sm-3">
            <label>{{ '::MeterCategory' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.meterCategory" class="w-100" nzAllowClear nzShowSearch>
              <nz-option *ngFor="let category of meterCategory" [nzValue]="category.value" [nzLabel]="'::Enum:MeterCategory.' + category.value | abpLocalization"></nz-option>
            </nz-select>
          </div>
          <div class="col-sm-3">
            <label>{{ '::Status' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.meterStatus" class="w-100" nzAllowClear nzShowSearch>
              <nz-option *ngFor="let status of meterStatus" [nzValue]="status.value" [nzLabel]="'::Enum:MeterStatus:' + status.value | abpLocalization"></nz-option>
            </nz-select>
          </div>
          <div class="col-sm-3">
            <label>{{ '::Phase' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.phaseId" class="w-100" nzAllowClear nzShowSearch>
              <nz-option *ngFor="let phase of phases" [nzValue]="phase.id" [nzLabel]="phase.phaseName"></nz-option>
            </nz-select>
          </div>
          <div class="col-sm-3">
            <label>{{ '::Plot' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.plotId" class="w-100" nzAllowClear nzShowSearch>
              <nz-option *ngFor="let plot of plots" [nzValue]="plot.id" [nzLabel]="plot.plotNo"></nz-option>
            </nz-select>
          </div>

          <div class="col-sm-auto d-flex align-items-end gap-1">
            <button type="button" class="btn btn-sm btn-outline-primary" (click)="clearFilters()">
              <i class="fas fa-undo"></i> {{ '::Reset' | abpLocalization }}
            </button>
            <button type="button" class="btn btn-primary btn-sm" (click)="list.get()">
              <i class="fa fa-filter"></i> {{ '::Apply' | abpLocalization }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="card mt-2">
    <div class="card-body">
      <ngx-datatable [rows]="meters.items" [count]="meters.totalCount" [list]="list" default>
        <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body" class="d-inline-block">
              <button class="btn btn-primary btn-sm dropdown-toggle" ngbDropdownToggle>
                <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
              </button>
              <div ngbDropdownMenu>
                <button *abpPermission="'Billing.MeterInfos.Edit'" ngbDropdownItem (click)="editMeter(row.id)">
                  {{ '::Edit' | abpLocalization }}
                </button>
                <button *abpPermission="'Billing.MeterInfos.Delete'" ngbDropdownItem (click)="delete(row.id)">
                  {{ '::Delete' | abpLocalization }}
                </button>
                <button *abpPermission="'Billing.MeterInfos.View'" ngbDropdownItem (click)="viewMeter(row.id)">
                  {{ '::View' | abpLocalization }}
                </button>
                <button *abpPermission="'Billing.MeterInfos.AttachDocument'" ngbDropdownItem (click)="uploadDocument(row.id)">
                  {{ '::AttachDocuments' | abpLocalization }}
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column [name]="'::MeterNo' | abpLocalization" prop="meterNo"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::Type' | abpLocalization" prop="meterType">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ ('::Enum:MeterType:' + row.meterType) | abpLocalization }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column [name]="'::Status' | abpLocalization" prop="meterStatus">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <span class="badge"
            [ngClass]="{
                'bg-success': row.meterStatus === 1,
                'bg-secondary': row.meterStatus === 2,
                'bg-danger': row.meterStatus === 3,
                'bg-warning': row.meterStatus === 4,
                'bg-dark': row.meterStatus === 5,
                'bg-info text-dark': row.meterStatus === 6,
            }">
                {{ ('::Enum:MeterStatus:' + row.meterStatus | abpLocalization )}}
            </span>
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column [name]="'::Phase' | abpLocalization" prop="phaseName"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::Plot' | abpLocalization" prop="plotNo"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::InstallationDate' | abpLocalization" prop="installationDate">
            <ng-template let-row="row" ngx-datatable-cell-template>
                {{ row. installationDate | date: "yyyy-MM-dd" }}
            </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column [name]="'::InitialReading' | abpLocalization" prop="initialReading"></ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>
</abp-page>
