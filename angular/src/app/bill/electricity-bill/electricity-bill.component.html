<abp-page [title]="'::Menu:ElectricityBill' | abpLocalization">

  <!-- PAGE TOOLBAR -->
  <abp-page-toolbar-container class="col">
    <div class="d-flex justify-content-end gap-2">

      <!-- Create -->
      <button
        class="btn btn-outline-primary btn-sm"
        type="button"
        (click)="navigateToCreate()">
        <i class="fa fa-plus me-1"></i>
        {{ '::AddElectricityBill' | abpLocalization }}
      </button>

    </div>
  </abp-page-toolbar-container>

  <!-- SEARCH + FILTERS -->
  <div class="card">
    <div class="card-body">

      <div class="row align-items-center">
        <div class="col-10">
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              [placeholder]="'::SearchHere' | abpLocalization"
              [(ngModel)]="filters.filter" />

            <button class="btn btn-primary" (click)="list.get()">
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>

        <div class="col-2 text-end">
          <button
            class="btn btn-outline-primary w-100"
            (click)="showFilter = !showFilter">
            {{ '::Filters' | abpLocalization }}
            <i class="fas" [ngClass]="showFilter ? 'fa-angle-up' : 'fa-angle-down'"></i>
          </button>
        </div>
      </div>

      <!-- FILTER PANEL -->
      <div *ngIf="showFilter" class="mt-2">
        <div class="row g-2">

          <!-- Meter -->
          <div class="col-sm-3">
            <label>{{ '::Meter' | abpLocalization }}</label>
            <nz-select
              [(ngModel)]="filters.meterInfoId"
              nzAllowClear
              nzShowSearch
              class="w-100">

              <nz-option
                *ngFor="let m of meterLookup"
                [nzValue]="m.id"
                [nzLabel]="m.meterNo + ' (' + m.ownerName + ')'">
              </nz-option>
            </nz-select>
          </div>

          <!-- Billing Month -->
          <div class="col-sm-3">
            <label>{{ '::BillingMonth' | abpLocalization }}</label>
            <input type="month" class="form-control" [(ngModel)]="filters.billingMonth" />
          </div>

          <!-- Status -->
          <div class="col-sm-3">
            <label>{{ '::Status' | abpLocalization }}</label>
            <nz-select
              [(ngModel)]="filters.status"
              nzAllowClear
              nzShowSearch
              class="w-100">

              <nz-option [nzValue]="null" [nzLabel]="'::All' | abpLocalization"></nz-option>

              <nz-option
                *ngFor="let s of billStatus"
                [nzValue]="s.value"
                [nzLabel]="'::Enum:BillStatus.' + s.value | abpLocalization">
              </nz-option>

            </nz-select>
          </div>

          <!-- Buttons -->
          <div class="col-sm-auto d-flex align-items-end gap-1">
            <button class="btn btn-sm btn-outline-primary" (click)="clearFilters()">
              <i class="fas fa-undo"></i> {{ '::Reset' | abpLocalization }}
            </button>

            <button class="btn btn-primary btn-sm" (click)="list.get()">
              <i class="fa fa-filter"></i> {{ '::Apply' | abpLocalization }}
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- TABLE -->
  <div class="card mt-2">
    <div class="card-body">

      <ngx-datatable [rows]="bills.items" [count]="bills.totalCount" [list]="list" default>

        <!-- ACTIONS -->
        <ngx-datatable-column
          [name]="'::Actions' | abpLocalization"
          [maxWidth]="150"
          [sortable]="false">

          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body" class="d-inline-block">

              <button class="btn btn-primary btn-sm dropdown-toggle" ngbDropdownToggle>
                <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
              </button>

              <div ngbDropdownMenu>

                <button ngbDropdownItem (click)="view(row.id)">
                  <i class="fa fa-eye me-2"></i>
                  {{ '::View' | abpLocalization }}
                </button>

                <button ngbDropdownItem (click)="delete(row.id)">
                  <i class="fa fa-trash me-2"></i>
                  {{ '::Delete' | abpLocalization }}
                </button>

              </div>
            </div>
          </ng-template>

        </ngx-datatable-column>

        <!-- METER -->
        <ngx-datatable-column
          [name]="'::Meter' | abpLocalization"
          prop="meterNo">
        </ngx-datatable-column>

        <!-- BILLING MONTH -->
        <ngx-datatable-column
          [name]="'::BillingMonth' | abpLocalization"
          prop="billingMonth">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.billingMonth | date:'yyyy-MM' }}
          </ng-template>
        </ngx-datatable-column>

        <!-- ISSUE DATE -->
        <ngx-datatable-column
          [name]="'::IssueDate' | abpLocalization"
          prop="issueDate">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.issueDate | date:'yyyy-MM-dd' }}
          </ng-template>
        </ngx-datatable-column>

        <!-- DUE DATE -->
        <ngx-datatable-column
          [name]="'::DueDate' | abpLocalization"
          prop="dueDate">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.dueDate | date:'yyyy-MM-dd' }}
          </ng-template>
        </ngx-datatable-column>

        <!-- TOTAL -->
        <ngx-datatable-column
          [name]="'::TotalPayable' | abpLocalization"
          prop="totalPayable">
        </ngx-datatable-column>

        <!-- STATUS -->
        <ngx-datatable-column
          [name]="'::Status' | abpLocalization"
          prop="status">

          <ng-template let-row="row" ngx-datatable-cell-template>
            <span
              class="badge"
              [class.bg-success]="row.status === 3"
              [class.bg-secondary]="row.status === 1 || row.status === 2"
              [class.bg-danger]="row.status === 4">

              {{ ('::Enum:BillStatus.' + row.status) | abpLocalization }}

            </span>
          </ng-template>

        </ngx-datatable-column>

      </ngx-datatable>

    </div>
  </div>

</abp-page>
