<abp-page [title]="'::Menu:PlotTransferHistory' | abpLocalization">
  <abp-page-toolbar-container class="col">
    <div class="text-end">
      <button
        *abpPermission="'Billing.PlotTransferHistories.Create'"
        id="create"
        class="btn btn-outline-primary btn-sm"
        type="button"
        (click)="navigateToCreate()">
        <i class="fa fa-plus me-1"></i> {{ '::NewPlotTransferHistory' | abpLocalization }}
      </button>
    </div>
  </abp-page-toolbar-container>

  <!-- Search + Filters -->
  <div class="card">
    <div class="card-body">
      <div class="row align-items-center">
        <div class="col-10">
          <div class="input-group">
            <input type="text" class="form-control" [placeholder]="'::SearchHere' | abpLocalization" [(ngModel)]="filters.filter" />
            <button type="button" class="btn btn-primary" (click)="list.get()">
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>
        <div class="col-2 text-end">
          <button class="btn btn-outline-primary w-100" (click)="showFilter = !showFilter">
            {{ '::Filters' | abpLocalization }}
            <i class="fas" [ngClass]="showFilter ? 'fa-angle-up' : 'fa-angle-down'"></i>
          </button>
        </div>
      </div>

      <div *ngIf="showFilter" class="mt-2">
        <div class="row g-2">
          <div class="col-sm-3">
            <label>{{ '::Plot' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.plotId" class="w-100" nzAllowClear nzShowSearch>
              <nz-option *ngFor="let plot of plots" [nzValue]="plot.id" [nzLabel]="plot.plotNo"></nz-option>
            </nz-select>
          </div>
          <div class="col-sm-3">
            <label>{{ '::FromConsumer' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.fromConsumerId" class="w-100" nzAllowClear nzShowSearch>
              <nz-option *ngFor="let consumer of consumers" [nzValue]="consumer.id" [nzLabel]="consumer.firstName + ' ' + consumer.lastName"></nz-option>
            </nz-select>
          </div>
          <div class="col-sm-3">
            <label>{{ '::ToConsumer' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.toConsumerId" class="w-100" nzAllowClear nzShowSearch>
              <nz-option *ngFor="let consumer of consumers" [nzValue]="consumer.id" [nzLabel]="consumer.firstName + ' ' + consumer.lastName"></nz-option>
            </nz-select>
          </div>
          <div class="col-sm-3">
            <label>{{ '::TransferType' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.transferType" class="w-100" nzAllowClear nzShowSearch>
              <nz-option *ngFor="let t of transferTypes" [nzValue]="t.value" [nzLabel]="'::Enum:TransferType.' + t.value | abpLocalization"></nz-option>
            </nz-select>
          </div>

          <div class="col-sm-auto d-flex align-items-end gap-1">
            <button type="button" class="btn btn-sm btn-outline-primary" (click)="clearFilters()">
              <i class="fas fa-undo"></i> {{ '::Reset' | abpLocalization }}
            </button>
            <button type="button" class="btn btn-primary btn-sm" (click)="list.get()">
              <i class="fa fa-filter"></i> {{ '::Apply' | abpLocalization }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="card mt-2">
    <div class="card-body">
      <ngx-datatable [rows]="transfers.items" [count]="transfers.totalCount" [list]="list" default>
        <!-- Actions -->
        <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body" class="d-inline-block">
              <button class="btn btn-primary btn-sm dropdown-toggle" ngbDropdownToggle>
                <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
              </button>
              <div ngbDropdownMenu>
                <button *abpPermission="'Billing.PlotTransferHistories.Edit'" ngbDropdownItem (click)="editTransfer(row.id)">
                  {{ '::Edit' | abpLocalization }}
                </button>
                <button *abpPermission="'Billing.PlotTransferHistories.Delete'" ngbDropdownItem (click)="delete(row.id)">
                  {{ '::Delete' | abpLocalization }}
                </button>
                <button *abpPermission="'Billing.PlotTransferHistories.View'" ngbDropdownItem (click)="viewTransfer(row.id)">
                  {{ '::View' | abpLocalization }}
                </button>
                 <button *ngIf="!row.isApproved" ngbDropdownItem (click)="approve(row.id)">
                    <i class="fa fa-check text-success me-1"></i>{{ '::Approve' | abpLocalization }}
                </button>

                <button *ngIf="!row.isApproved" ngbDropdownItem (click)="reject()">
                    <i class="fa fa-times text-danger me-1"></i>{{ '::Reject' | abpLocalization }}
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <!-- Columns -->
        <ngx-datatable-column [name]="'::Plot' | abpLocalization" prop="plotNo"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::FromConsumer' | abpLocalization" prop="fromConsumerName"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::ToConsumer' | abpLocalization" prop="toConsumerName"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::TransferType' | abpLocalization" prop="transferType">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ ('::Enum:TransferType.' + row.transferType) | abpLocalization }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column [name]="'::RegistryNo' | abpLocalization" prop="registryNo"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::Amount' | abpLocalization" prop="considerationAmount"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::Status' | abpLocalization" prop="isApproved">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <span [class.text-success]="row.isApproved" [class.text-danger]="!row.isApproved">
              {{ row.isApproved ? ('::Approved' | abpLocalization) : ('::Pending' | abpLocalization) }}
            </span>
          </ng-template>
        </ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>
</abp-page>

<abp-modal [(visible)]="rejectModalVisible">
  <ng-template #abpHeader>
    <h3>{{'::RejectionReason' | abpLocalization}}</h3>
  </ng-template>

  <ng-template #abpBody>
     <form [formGroup]="rejectForm">
      <div class="form-group mb-3">
        <label>{{ '::RejectionReason' | abpLocalization }}</label>
        <textarea formControlName="reason" rows="4" class="form-control"
          placeholder="{{ '::EnterReason' | abpLocalization }}"></textarea>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" (click)="isModalOpen = false">
      {{ '::Cancel' | abpLocalization }}
    </button>
    <button type="submit" class="btn btn-primary" (click)="save()" [disabled]="form?.invalid">
      <i class="fas fa-check"></i> {{ '::Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
